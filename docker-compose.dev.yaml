x-bot-dev: &bot-dev
  env_file: [.env, .env.test]
  volumes:
    - ./financial_bot:/application/financial_bot
    - ./services:/application/services
    - ./core:/application/core
    - ./migrations:/application/migrations
    - ./tests:/application/tests
    - ./alembic.ini:/application/alembic.ini
    - ./pytest.ini:/application/pytest.ini
    - ./logger_config.py:/application/logger_config.py
    - ./${LOG_PATH:-logs}:/application/logs

services:
  # --- режим WEBHOOK (по умолчанию) ---
  fin_bot:
    <<: *bot-dev
    command: >
      uvicorn financial_bot.webapp:app
      --host 0.0.0.0 --port 8081 --workers 1 --reload
    expose: ["8081"]
    environment:
      WEBHOOK_BASE_URL: https://bot-dev.capimind.net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [app-network]
    depends_on:
      fin_bot: {condition: service_healthy}

  # --- режим POLLING (только по явному запросу) ---
  fin_bot_polling:
    <<: *bot-dev
    profiles: ["polling"]
    build: {context: ., args: {USER_ID: "${USER_ID:-1000}", GROUP_ID: "${GROUP_ID:-1000}"}}
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    networks: [app-network]
    command: python -m financial_bot.main
    environment:
      PYTHONPATH: /application
      PYTHONUNBUFFERED: "1"
      LOG_FILENAME: bot.log
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    volumes:
      - ./financial_bot:/application/financial_bot
      - ./services:/application/services
      - ./core:/application/core
      - ./logger_config.py:/application/logger_config.py

  db:
    ports: ["127.0.0.1:5432:5432"]

  redis:
    ports: ["127.0.0.1:6379:6379"]

  db_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports: ["127.0.0.1:5433:5432"]
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:6380:6379"]
    networks: [app-network]