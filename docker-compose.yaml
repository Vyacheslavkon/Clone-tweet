x-common-setup: &common-setup
  build:
    context: .
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "3"}
  restart: unless-stopped
  networks: [app-network]
  environment: &common-env
    PYTHONPATH: /application
    PYTHONUNBUFFERED: "1"

services:
  fin_bot:
    <<: *common-setup
    env_file: [.env]
    environment:
      <<: *common-env
      LOG_FILENAME: bot.log
    volumes:
      - shared_stt_audio:/tmp/financial_bot_stt
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    <<: *common-setup
    env_file: [.env]
    command: celery -A services.celery_app:app worker --loglevel=info
    environment:
      <<: *common-env
      LOG_FILENAME: worker.log
    volumes:
      - shared_stt_audio:/tmp/financial_bot_stt
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  db:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    networks: [app-network]

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"

volumes:
  db-data:
  shared_stt_audio:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=512m,uid=1000"}